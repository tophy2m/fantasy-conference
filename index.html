<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantasy Conference · Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--turf:#16402A;--turf2:#1A4A31;--night:#0F2A1B;--gold:#E8B23A;--chalk:#F4F1E8;--ink:#13241A;--muted:#B9C6B6;--good:#2E7D4F;--bad:#B8322A}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night)}
body{font-family:Barlow,system-ui,sans-serif;color:var(--chalk);background:repeating-linear-gradient(180deg,var(--turf) 0 72px,var(--turf2) 72px 144px);min-height:100vh}
main{max-width:480px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--gold)}
h1{margin:4px 0 0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:48px;line-height:.9;text-transform:uppercase}
h1 span{color:var(--gold)}
p{margin:0;line-height:1.45;color:#D7DFD2}
.card{background:var(--chalk);color:var(--ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input{height:48px;border-radius:10px;border:1.5px solid var(--ink);padding:0 12px;font:500 16px Barlow,sans-serif;color:var(--ink);background:#fff;width:100%}
button{height:52px;border-radius:12px;border:0;background:var(--gold);color:var(--ink);font:900 22px 'Big Shoulders Display',sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer}
button.secondary{background:transparent;border:2px solid var(--ink)}
button:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px}.row>*{flex:1}
.status{display:flex;align-items:flex-start;gap:10px;font-size:15px;line-height:1.35}
.dot{flex:0 0 14px;height:14px;border-radius:50%;background:#A7B0A9;margin-top:3px}
.dot.ok{background:var(--good)}.dot.fail{background:var(--bad)}
pre{margin:0;background:var(--night);color:var(--chalk);border-radius:12px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
</style>
</head>
<body>
<main>
  <div>
    <div class="eyebrow">SMOKE TEST · NOT THE GAME</div>
    <h1>Fantasy<br>General <span>Conference</span></h1>
  </div>
  <p>If you're reading this on your phone, Vercel works. Next, check that this page can talk to the Google Sheet.</p>

  <section class="card">
    <label>Apps Script web app URL (ends in /exec)
      <input id="api" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
    </label>
    <div class="status"><span id="d1" class="dot"></span><span id="s1">1 · Read from sheet: not run</span></div>
    <div class="status"><span id="d2" class="dot"></span><span id="s2">2 · Write to sheet: not run</span></div>
    <label>Test name
      <input id="name" type="text" maxlength="40" value="Test player">
    </label>
    <div class="row">
      <button id="ping" class="secondary" type="button">1 · Read</button>
      <button id="save" type="button">2 · Write</button>
    </div>
  </section>

  <pre id="log">Log will show here.</pre>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var apiInput = $('api');
  var fromQuery = new URLSearchParams(location.search).get('api');
  var saved = null;
  try { saved = localStorage.getItem('fgc_api'); } catch (e) {}
  apiInput.value = fromQuery || saved || '';

  function api() {
    var v = apiInput.value.trim();
    try { localStorage.setItem('fgc_api', v); } catch (e) {}
    return v;
  }
  function log(label, obj) {
    var t = new Date().toLocaleTimeString();
    $('log').textContent = '[' + t + '] ' + label + '\n' + (typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2)) + '\n\n' + ($('log').textContent === 'Log will show here.' ? '' : $('log').textContent);
  }
  function setStatus(n, ok, text) {
    $('d' + n).className = 'dot ' + (ok ? 'ok' : 'fail');
    $('s' + n).textContent = text;
  }
  function fmt(iso) {
    return new Date(iso).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }
  function busy(b) { $('ping').disabled = b; $('save').disabled = b; }

  $('ping').addEventListener('click', function () {
    var url = api();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { setStatus(1, false, '1 · Paste the /exec URL first'); return; }
    busy(true);
    fetch(url, { method: 'GET' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        log('READ', d);
        setStatus(1, !!d.ok, d.ok ? '1 · Read OK: "' + d.sheet + '" · ' + (d.locked ? 'LOCKED' : 'open until ' + fmt(d.lockAt)) : '1 · Read failed');
      })
      .catch(function (err) { log('READ ERROR', String(err)); setStatus(1, false, '1 · Read failed: ' + err.message); })
      .finally(function () { busy(false); });
  });

  $('save').addEventListener('click', function () {
    var url = api();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { setStatus(2, false, '2 · Paste the /exec URL first'); return; }
    busy(true);
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ name: $('name').value, note: 'Sent from ' + location.host + ' at ' + new Date().toString() })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        log('WRITE', d);
        if (d.ok) setStatus(2, true, '2 · Write OK: ' + d.totalRows + ' row(s) in SmokeTest tab');
        else if (d.error === 'locked') setStatus(2, false, '2 · Refused: picks locked since ' + fmt(d.lockAt) + ' (lock works)');
        else setStatus(2, false, '2 · Write failed: ' + (d.error || 'unknown'));
      })
      .catch(function (err) { log('WRITE ERROR', String(err)); setStatus(2, false, '2 · Write failed: ' + err.message); })
      .finally(function () { busy(false); });
  });
})();
</script>
</body>
</html>
